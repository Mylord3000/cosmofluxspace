<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cosmoflux</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    color:#1a1a18;
    background:#faf7f0;
    font-size:16px;
    line-height:1.65;
  }
  .page{max-width:640px;margin:0 auto;padding:3.5rem 1.25rem 2rem}
  header{margin-bottom:3.5rem}
  .wordmark{font-weight:700}
  p{margin-bottom:1rem}
  figure{margin:3rem 0 0}
  figure img{width:100%;display:block}
  figcaption{font-size:.75rem;color:#8a857c;margin-top:.4rem}
  figcaption a{color:#8a857c}
  footer{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid #eee8dc}
  footer a{color:#1a1a18;text-decoration:none}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="page">

<header>
  <span class="wordmark">cosmoflux</span>
</header>

<figure>
  <img src="veil_bg.jpg" alt="The Veil Nebula">
  <figcaption><a href="https://esahubble.org/images/potw2113a/">Veil Nebula</a>, ESA/Hubble &amp; NASA, Z. Levay (CC BY 4.0)</figcaption>
</figure>

<footer>
  <a href="mailto:adam@cosmofluxspace.com">adam@cosmofluxspace.com</a>
</footer>

</div>
</body>
</html>
